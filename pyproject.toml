[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvus"
version = "0.1.0"
description = "Local-first, security-minded personal assistant for macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "keyring>=25.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
voice = [
    "speechrecognition>=3.10.0",
    "pyaudio>=0.2.13",
    "faster-whisper>=1.0",
    "sounddevice>=0.5",
    # Apple Silicon fast paths (skipped automatically on other platforms)
    "mlx-whisper>=0.4; sys_platform=='darwin' and platform_machine=='arm64'",
    "mlx-audio>=0.5; sys_platform=='darwin' and platform_machine=='arm64'",
]

[project.scripts]
jarvus = "app.main:main"
typhoon = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
